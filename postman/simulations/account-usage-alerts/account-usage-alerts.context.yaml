assumptions:
  - id: incoming-webhook-json
    status: supported
    claim: Slack incoming webhooks accept a JSON object containing a text string.
    reason: >-
      Slack documents this request shape. The local simulation independently
      validates Content-Type and text and observed the Java client sending valid
      requests; this does not establish production authorization or routing.
    verification: >-
      On 2026-11-20, read Slack's incoming-webhook documentation. Ran
      SlackUsageAlertTest.postmanSimulationReceivesRealClientAndRateLimitRetry against
      the local simulation: POST /services/ok returned 200; /_state reported ok=1,
      rate=2, invalid=0. The test passed. No real Slack webhook was called.
    source: >-
      https://docs.slack.dev/messaging/sending-messages-using-incoming-webhooks/;
      framework/src/test/java/org/tron/core/service/SlackUsageAlertTest.java;
      postman/mocks/slack-usage/default.js
    updated_at: "2026-11-20"
  - id: rate-limit-retry
    status: supported
    claim: A Slack 429 response specifies a retry delay in seconds in Retry-After.
    reason: >-
      Slack's rate-limit documentation specifies this behavior. The stand-in models
      one 429 with Retry-After=1, and the real client waited at least that delay
      before retrying successfully.
    verification: >-
      On 2026-11-20 the simulation request log recorded POST /services/rate returning
      429 at 08:01:19.967 UTC and a second POST returning 200 at 08:01:20.987 UTC.
      The test asserted exactly two requests to that path and no invalid payloads.
      The local HTTP tests also exercised permanent rejection, redirects and 503 retry.
      After review fixes on the same date, finalRateLimitDelaysNextQueuedAlert
      exercised two queued messages and asserted that the next message waited at
      least one second after the preceding message's third and final 429 response.
    source: >-
      https://docs.slack.dev/apis/web-api/rate-limits/;
      framework/src/test/java/org/tron/core/service/SlackUsageAlertTest.java;
      chainbase/src/main/java/org/tron/core/service/SlackUsageAlert.java
    updated_at: "2026-11-20"
  - id: production-channel-delivery
    status: unknown
    claim: The deployment's webhook can deliver into the intended Slack channel.
    reason: No production webhook or channel has been supplied or exercised.
    verification: >-
      Only localhost stand-ins were used on 2026-11-20. Set
      ACCOUNT_USAGE_SLACK_WEBHOOK_URL in the production process environment and
      observe an authorized real alert to settle delivery and channel routing.
    source: >-
      docs/fast-sync-header-storage.md;
      https://docs.slack.dev/messaging/sending-messages-using-incoming-webhooks/
    updated_at: "2026-11-20"

