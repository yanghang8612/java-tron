# What this simulation stands in for and what work it unblocks. Both need
# hindsight, so they are the last thing to write. The members it serves, their
# route keys and the hosts they answer for are in the .sim.yaml beside this file.
purpose:
  stands_in_for: >-
    Slack incoming webhooks using a local mock built from Slack's published contract.
    Published mock discovery was skipped because the CLI is signed out.
  unblocks: >-
    Exercise the real Java SlackUsageAlert client's JSON POST and 429 retry without
    a real webhook credential or messages to a real Slack channel.

