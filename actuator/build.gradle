description = "actuator – a series of transactions for blockchain."

dependencies {
    api project(":chainbase")
    api project(":protocol")
    api project(":crypto")
}

test {

    testLogging {
        // showing skipped occasionally should prevent CI timeout due to lack of standard output
        events = ["skipped", "failed"] // "started", "passed"
        // showStandardStreams = true
        exceptionFormat = "full"

        debug.events = ["skipped", "failed"]
        debug.exceptionFormat = "full"

        info.events = ["failed", "skipped"]
        info.exceptionFormat = "full"

        warn.events = ["failed", "skipped"]
        warn.exceptionFormat = "full"
    }

    maxHeapSize = "1200m"

    if (System.getenv("CI") == null) {
        maxParallelForks = Runtime.runtime.availableProcessors().intdiv(2) ?: 1
    }

    // 100 full 3 MiB JUMPDEST analyses retain about 16 GiB. Keep that off the
    // default 1200m test heap. ./gradlew :actuator:test --tests
    // org.tron.core.vm.program.JumpDestCacheHeapTest -PjumpDestHeapMeasure
    if (project.hasProperty("jumpDestHeapMeasure")) {
        minHeapSize = "20g"
        maxHeapSize = "20g"
        maxParallelForks = 1
        jvmArgs "-XX:+UseSerialGC"
        systemProperty "jumpdest.heap.measure", "true"
        testLogging.showStandardStreams = true
    }
}

jacocoTestReport {
    reports {
        xml.enabled = true
        html.enabled = true
    }
    getExecutionData().setFrom(fileTree('../framework/build/jacoco').include("**.exec"))
    afterEvaluate {
        classDirectories.from = classDirectories.files.collect {
            fileTree(dir: it,)
        }
    }
}
