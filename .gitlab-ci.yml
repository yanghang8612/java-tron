stages:
  - build
  - upload
  - deploy_test

variables:
  GIT_DEPTH: 0

# docker官方镜像
image: $DOCKER_IMAGE


# 在打包机进行打包
build_job:
  stage: build
  tags:
    - tronlink-backend-package
  script:
    - set -e
    - log() { echo "$(date '+%Y-%m-%d %H:%M:%S') $*"; }
    - short_sha=$(git rev-parse --short=8 $CI_COMMIT_SHA)
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        short_sha="$short_sha:$CI_COMMIT_TAG"
      fi
    - log "当前编译的版本号为：$short_sha"
    #    - sed -i "s/1\.0\.0/$short_sha/g" src/main/java/org/tron/http/HealthServlet.java
    #    - ./gradlew build -x test --no-daemon -Dorg.gradle.java.home=/data/jdk-17.0.12
    - ./gradlew clean build -x test
    - log "编译成功...tronlink-statics:$short_sha.jar"
    #  拷贝到指定目录
    - cp -f ./build/libs/FullNode.jar /data/tronlink-backend/FullNode/FullNode:$short_sha.jar
  only:
    - master
    - merge_requests
    - tags
    - main_tronlink
  allow_failure: false

upload_job:
  stage: upload
  tags:
    - tronlink-backend-package
  script:
    - set -e
    - echo "获取版本号"
    - short_sha=$(git rev-parse --short=8 "$CI_COMMIT_SHA")
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        short_sha="$short_sha:$CI_COMMIT_TAG"
      fi
      echo "使用版本号：$short_sha"
      export VERSION="$short_sha"

    - cp -f scripts/s3up.py /data/tronlink-backend/FullNode/s3up.py
    - cp -f scripts/s3up2.py /data/tronlink-backend/FullNode/s3up2.py

    - cd /data/tronlink-backend/FullNode/

    - JAR_NAME="FullNode:${VERSION}.jar"
    - ASC_NAME="${JAR_NAME}.asc"
    - ZIP_NAME="buildsign:${VERSION}.zip"

    - echo "准备签名：$JAR_NAME"
    - gpg --batch --yes --armor --sign --local-user 993261E937FFD00CBEAD76F318F3C1F8D9FC809B "$JAR_NAME"
    - gpg --batch --yes --armor --detach-sign --local-user 993261E937FFD00CBEAD76F318F3C1F8D9FC809B "$JAR_NAME"

    - if [[ ! -f "$JAR_NAME" || ! -f "$ASC_NAME" ]]; then echo "缺少 $JAR_NAME 或签名文件 $ASC_NAME"; exit 1; fi

    - zip -j "$ZIP_NAME" "$JAR_NAME" "$ASC_NAME"
    - echo "打包完成：$ZIP_NAME"

    - python3 ../s3up.py "$ZIP_NAME" FullNode
    - python3 ../s3up2.py "$ZIP_NAME" FullNode
    - echo "上传成功 -> $ZIP_NAME"

    - rm -f "$ZIP_NAME" "$JAR_NAME" "$ASC_NAME"
    - rm -f s3up.py s3up2.py
  only:
    - master
    - merge_requests
    - tags
  allow_failure: false


deploy_test:
  stage: deploy_test
  tags:
    - tronlink-backend-test-deploy
  script:
    - chmod +x scripts/deploy.sh
    - ./scripts/deploy.sh
  only:
    - master
    - merge_requests
  allow_failure: true
